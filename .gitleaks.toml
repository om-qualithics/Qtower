title = "Q Tower gitleaks config"

# Extends gitleaks' default ruleset (all built-in rules stay active) and
# adds one allowlist entry, rather than replacing the rule set - Qtower
# Code Scan (Milestone 13) auto-loads this file (gitleaks' own precedence:
# (target path)/.gitleaks.toml is picked up automatically with no --config
# flag needed, see `gitleaks detect --help`).
[extend]
useDefault = true

# False-positive class: this codebase's "catalog as code" pattern
# (apps/api/modules/policy/questions.py, training modules, etc.) declares
# many Python kwargs named `key="some_snake_case_identifier"` - e.g.
# `Question(key="q3_9_default_tier", ...)`. gitleaks' generic-api-key rule
# pattern-matches on `key\s*=\s*"..."` and occasionally crosses its entropy
# threshold on these identifiers purely because they mix letters, digits,
# and underscores (confirmed via a live gitleaks run against
# questions.py:313 during a real Code Scan - entropy 3.572, RuleID
# generic-api-key, extracted "secret" was literally "q3_9_default_tier").
# A real API key/token/secret is never a lowercase snake_case Python
# identifier (mixed case, base64/hex charset, hyphens are the norm), so
# this allowlist is scoped tightly to that shape - it does not weaken
# detection of an actual credential, which this rule (and every other
# default rule) still fully covers.
[allowlist]
description = "Snake_case Python identifiers (e.g. a `key=` kwarg value) are not secrets"
regexes = [
  '''^[a-z][a-z0-9_]*$''',
]
